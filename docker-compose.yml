services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./local.nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - existdb
      - fuseki
    networks:
      - backend

  fuseki:
    image: secoresearch/fuseki:latest
    container_name: fuseki
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=admin
    networks:
      - backend

  id-manager:
    build:
      context: ../betmas-id-manager
    container_name: id-manager
    volumes:
      - id-manager-data:/data
    networks:
      - backend

  existdb:
    build:
      context: .
      args:
        EXIST_VERSION: ${EXIST_VERSION:-release}
    container_name: exist
    ports:
      - "8080:8080"
    environment:
      - EXISTDB_ADMIN_PASSWORD=admin
      - ID_MANAGER_URL=http://id-manager:8080
    healthcheck:
      test:
        [
          "CMD",
          "java",
          "org.exist.start.Main",
          "client",
          "--no-gui",
          "--user",
          "guest",
          "--password",
          "guest",
          "--xpath",
          "system:get-version()",
        ]
      interval: 10s
      timeout: 7s
      retries: 3
      start_period: 1s
      start_interval: 5s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  id-manager-data:
